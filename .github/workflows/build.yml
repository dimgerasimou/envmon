name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32c6
          path: firmware
          command: idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci" build

      - uses: actions/upload-artifact@v4
        with:
          name: envmon-firmware
          path: firmware/build/*.bin

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          find firmware/main firmware/components -name '*.[ch]' \
            | xargs clang-format --dry-run --Werror
